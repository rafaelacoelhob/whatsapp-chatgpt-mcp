# WhatsApp -> ChatGPT (via MCP)
# Sobe 3 containers: banco (Postgres), Evolution API (ponte com o WhatsApp)
# e o servidor MCP (conector que o ChatGPT acessa).
#
# Uso: copiar .env.example para .env, preencher, e rodar: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution:
    # se a imagem não for encontrada, alternativa: atendai/evolution-api:v2.2.3
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080" # painel/manager e API — pode ficar só na rede interna
    environment:
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_LOCAL_ENABLED: "true"
      CACHE_REDIS_ENABLED: "false"
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances

  mcp:
    build: ./mcp-server
    restart: always
    depends_on:
      - evolution
    environment:
      PORT: "8080"
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-ana}
      MCP_PATH_SECRET: ${MCP_PATH_SECRET}
      BLOCKED_NUMBERS: ${BLOCKED_NUMBERS:-}

  # HTTPS automático (Let's Encrypt) na frente do conector — o ChatGPT exige HTTPS válido.
  # Requer o DOMAIN do .env apontando para o IP da VPS.
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - mcp
    ports:
      - "80:80"
      - "443:443"
    command: ["sh", "-c", "printf '${DOMAIN} {\\n\\treverse_proxy mcp:8080\\n}\\n' > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  evolution_pgdata:
  evolution_instances:
  caddy_data:
  caddy_config:
